name: Patch watch
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: ./waw api sync
      - run: ./waw target status --fail-on-drift
